version: "3.9"

services:
  database:
    build: ./database
    container_name: zt_database
    environment:
      POSTGRES_DB: studydb
      POSTGRES_USER: studyuser
      POSTGRES_PASSWORD: studypass
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: zt_backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: studydb
      DB_USER: studyuser
      DB_PASSWORD: studypass
    depends_on:
      - database
    ports:
      - "5001:5001"

  frontend:
    build: ./frontend
    container_name: zt_frontend
    environment:
      BACKEND_URL: http://backend:5001
    depends_on:
      - backend
    ports:
      - "5000:5000"
